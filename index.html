<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Leave Requests — Matière Noire</title>
<style>
  :root{
    --ink:#1c1d1f; --paper:#f7f6f3; --line:#e2e0da;
    --accent:#2f5d50; --accent-soft:#e7efec;
    --warn:#b3541e; --warn-soft:#fbeee3;
    --danger:#a4333b; --danger-soft:#f8e8e8;
    --muted:#6f6d68; --grey:#8a8781; --grey-soft:#eeece7;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);padding:32px 16px 80px;}
  .wrap{max-width:760px;margin:0 auto;}
  header{
    display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
    margin-bottom:28px;border-bottom:2px solid var(--ink);padding-bottom:16px;
  }
  h1{font-size:1.5rem;margin:0;letter-spacing:-0.02em;}
  .subtitle{color:var(--muted);font-size:0.85rem;margin-top:4px;}
  select#userSelect{
    padding:8px 10px;border:1px solid var(--ink);background:white;border-radius:6px;
    color:var(--ink);font-weight:600;
  }
  .card{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:24px;}
  .card h2{font-size:1rem;margin:0 0 16px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted);}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .form-grid .full{grid-column:1 / -1;}
  label{display:block;font-size:0.8rem;font-weight:600;margin-bottom:6px;}
  input[type=date], select.field, textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);
    font-family:inherit;font-size:0.95rem;
  }
  textarea{resize:vertical;min-height:56px;}
  .days-hint{font-size:0.8rem;color:var(--muted);margin-top:4px;}
  button.primary{
    margin-top:18px;background:var(--ink);color:white;border:none;padding:11px 20px;
    border-radius:8px;font-weight:600;cursor:pointer;
  }
  button.primary:disabled{background:#c9c7c1;cursor:not-allowed;}
  button.primary:hover:not(:disabled){opacity:0.88;}
  .req{padding:14px 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;}
  .req:last-child{border-bottom:none;}
  .req-main{display:flex;flex-direction:column;gap:3px;}
  .req-dates{font-weight:700;}
  .req-meta{font-size:0.8rem;color:var(--muted);}
  .req-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .badge{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .badge.pending{background:var(--warn-soft);color:var(--warn);}
  .badge.approved{background:var(--accent-soft);color:var(--accent);}
  .badge.rejected{background:var(--danger-soft);color:var(--danger);}
  .badge.cancelled{background:var(--grey-soft);color:var(--grey);}
  .act-btn{border:1px solid var(--line);background:white;padding:6px 12px;border-radius:8px;font-size:0.8rem;font-weight:700;cursor:pointer;}
  .act-btn.withdraw{color:var(--danger);border-color:var(--danger);}
  .act-btn.withdraw:hover{background:var(--danger-soft);}
  .empty{color:var(--muted);font-size:0.9rem;padding:20px 0;text-align:center;}
  .note-pill{font-size:0.8rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px;max-width:420px;white-space:pre-wrap;}
  .status-line{font-size:0.78rem;color:var(--muted);text-align:center;margin-top:20px;}
  .placeholder{color:var(--muted);font-size:0.9rem;text-align:center;padding:30px 0;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>My Leave Requests</h1>
      <div class="subtitle">Matière Noire — internal tool</div>
    </div>
    <select id="userSelect"></select>
  </header>

  <div id="placeholder" class="placeholder">Select your name to get started.</div>

  <div id="app" class="hidden">
    <div class="card">
      <h2>New request</h2>
      <div class="form-grid">
        <div>
          <label>Start date</label>
          <input type="date" id="startDate">
        </div>
        <div>
          <label>End date</label>
          <input type="date" id="endDate">
        </div>
        <div class="full">
          <label>Type</label>
          <select class="field" id="leaveType">
            <option>Congés payés</option>
            <option>RTT</option>
            <option>Sans solde</option>
            <option>Arrêt maladie</option>
            <option>Autre</option>
          </select>
        </div>
        <div class="full">
          <label>Note (optional)</label>
          <textarea id="note" placeholder="Any context for the approver..."></textarea>
        </div>
        <div class="full days-hint" id="daysHint"></div>
      </div>
      <button class="primary" id="submitBtn">Submit request</button>
    </div>

    <div class="card">
      <h2>My requests</h2>
      <div id="list"></div>
    </div>

    <div class="status-line" id="statusLine">Connecting…</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// Paste the SAME firebaseConfig object used in your other Matière Noire tools.
const firebaseConfig = {
  apiKey: "AIzaSyByf4SmnGJvfkkJVFhfINXikb8I8ge5VRU",
  authDomain: "matiere-noire-todo.firebaseapp.com",
  databaseURL: "https://matiere-noire-todo-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "matiere-noire-todo",
  storageBucket: "matiere-noire-todo.firebasestorage.app",
  messagingSenderId: "583651643354",
  appId: "1:583651643354:web:74b78c43316b9d657dfae3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const requestsRef = db.ref("conges");
const employeesRef = db.ref("people/employees");
const directionRef = db.ref("people/direction");

const DEFAULT_EMPLOYEES = ["Aleksandra","Margot","Lucien","Priscille","Bensu","Orlando","Yoojin","Kaito"];
const DEFAULT_DIRECTION = ["Baptiste","Sam","Pierre","Félix"];

let currentUser = localStorage.getItem("conges-user") || "";
let employees = [];
let requests = {};

const userSelect = document.getElementById("userSelect");
const placeholder = document.getElementById("placeholder");
const app = document.getElementById("app");
const listEl = document.getElementById("list");
const statusLine = document.getElementById("statusLine");

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]
  ));
}
function fmtDate(iso){
  return new Date(iso).toLocaleDateString("en-GB", { day:"2-digit", month:"short", year:"numeric" });
}
// ---- French national public holidays (métropole), computed per year ----
const _holidayCache = {};
function easterSunday(year){
  // Meeus/Jones/Butcher Gregorian algorithm
  const a=year%19, b=Math.floor(year/100), c=year%100;
  const d=Math.floor(b/4), e=b%4, f=Math.floor((b+8)/25);
  const g=Math.floor((b-f+1)/3), h=(19*a+b-d-g+15)%30;
  const i=Math.floor(c/4), k=c%4, l=(32+2*e+2*i-h-k)%7;
  const m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31);
  const day=((h+l-7*m+114)%31)+1;
  return new Date(year, month-1, day);
}
function pad2(n){ return String(n).padStart(2,"0"); }
function ymdLocal(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function holidaysForYear(year){
  if (_holidayCache[year]) return _holidayCache[year];
  const set = new Set([
    `${year}-01-01`, // Jour de l'an
    `${year}-05-01`, // Fête du travail
    `${year}-05-08`, // Victoire 1945
    `${year}-07-14`, // Fête nationale
    `${year}-08-15`, // Assomption
    `${year}-11-01`, // Toussaint
    `${year}-11-11`, // Armistice
    `${year}-12-25`  // Noël
  ]);
  const easter = easterSunday(year);
  const addOffset = off => { const d = new Date(easter); d.setDate(d.getDate()+off); set.add(ymdLocal(d)); };
  addOffset(1);  // Lundi de Pâques
  addOffset(39); // Ascension
  addOffset(50); // Lundi de Pentecôte
  _holidayCache[year] = set;
  return set;
}
// Parse "YYYY-MM-DD" as a local-midnight date (avoids timezone drift).
function parseLocal(iso){ const [y,m,d] = iso.split("-").map(Number); return new Date(y, m-1, d); }
function calendarDays(start, end){
  return Math.round((parseLocal(end) - parseLocal(start)) / (1000*60*60*24)) + 1;
}
function workingDays(start, end){
  let count = 0;
  const d = parseLocal(start), last = parseLocal(end);
  while (d <= last){
    const day = d.getDay(); // 0 = Sun, 6 = Sat
    const isWeekend = (day === 0 || day === 6);
    const isHoliday = holidaysForYear(d.getFullYear()).has(ymdLocal(d));
    if (!isWeekend && !isHoliday) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}
function daysLabel(start, end){
  const c = calendarDays(start, end), w = workingDays(start, end);
  return `${c} calendar day${c>1?"s":""} · ${w} working day${w>1?"s":""}`;
}

employeesRef.once("value", snap => { if (snap.val() === null) employeesRef.set(DEFAULT_EMPLOYEES); });
directionRef.once("value", snap => { if (snap.val() === null) directionRef.set(DEFAULT_DIRECTION); });

function buildUserSelect(){
  userSelect.innerHTML = `<option value="">Select your name</option>` +
    employees.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  userSelect.value = employees.includes(currentUser) ? currentUser : "";
}

function toggleView(){
  if (currentUser){ placeholder.classList.add("hidden"); app.classList.remove("hidden"); }
  else { placeholder.classList.remove("hidden"); app.classList.add("hidden"); }
}

userSelect.addEventListener("change", () => {
  currentUser = userSelect.value;
  localStorage.setItem("conges-user", currentUser);
  toggleView();
  renderList();
});

function renderList(){
  if (!currentUser) return;
  const mine = Object.entries(requests)
    .filter(([, r]) => r.name === currentUser)
    .sort((a,b) => b[1].createdAt - a[1].createdAt);

  if (mine.length === 0){
    listEl.innerHTML = `<div class="empty">No requests yet.</div>`;
    return;
  }
  listEl.innerHTML = mine.map(([id, r]) => {
    const decided = r.decidedBy
      ? `<div class="req-meta">${r.status === "approved" ? "Approved" : "Rejected"} by ${esc(r.decidedBy)} · ${fmtDate(r.decidedAt)}</div>`
      : "";
    const withdrawBtn = r.status === "pending"
      ? `<button class="act-btn withdraw" data-action="withdraw" data-id="${id}">Withdraw</button>`
      : "";
    return `
      <div class="req">
        <div class="req-main">
          <div class="req-dates">${fmtDate(r.startDate)} → ${fmtDate(r.endDate)} <span style="font-weight:400;color:var(--muted);">(${daysLabel(r.startDate, r.endDate)}) · ${esc(r.type)}</span></div>
          ${r.note ? `<div class="note-pill">${esc(r.note)}</div>` : ""}
          ${decided}
        </div>
        <div class="req-right">
          <span class="badge ${r.status}">${r.status}</span>
          ${withdrawBtn}
        </div>
      </div>`;
  }).join("");
}

// Withdraw = set status to "cancelled" (never deletes data).
listEl.addEventListener("click", e => {
  const btn = e.target.closest('[data-action="withdraw"]');
  if (!btn) return;
  const id = btn.dataset.id;
  const r = requests[id];
  if (!r || r.name !== currentUser || r.status !== "pending") return;
  if (!confirm("Withdraw this request? It will be marked as cancelled.")) return;
  const update = { status: "cancelled", decidedBy: null, decidedAt: null, cancelledAt: Date.now() };
  requests[id] = { ...r, ...update };
  renderList();
  requestsRef.child(id).update(update).catch(err => alert("Could not save: " + err.message));
});

// ---- Form: listeners attached ONCE. ----
const startDateEl = document.getElementById("startDate");
const endDateEl = document.getElementById("endDate");
const daysHint = document.getElementById("daysHint");
const noteEl = document.getElementById("note");
const typeEl = document.getElementById("leaveType");

function updateHint(){
  if (!startDateEl.value || !endDateEl.value){ daysHint.textContent = ""; return; }
  if (new Date(endDateEl.value) < new Date(startDateEl.value)){
    daysHint.textContent = "End date must be on or after start date.";
    daysHint.style.color = "var(--danger)";
  } else {
    daysHint.textContent = daysLabel(startDateEl.value, endDateEl.value) + " requested.";
    daysHint.style.color = "var(--muted)";
  }
}
startDateEl.addEventListener("change", updateHint);
endDateEl.addEventListener("change", updateHint);

document.getElementById("submitBtn").addEventListener("click", () => {
  if (!currentUser){ alert("Select your name first."); return; }
  const start = startDateEl.value, end = endDateEl.value;
  if (!start || !end || new Date(end) < new Date(start)){
    alert("Please pick a valid date range.");
    return;
  }
  const newReq = {
    name: currentUser, startDate: start, endDate: end,
    type: typeEl.value, note: noteEl.value.trim(),
    status: "pending", createdAt: Date.now(),
    decidedBy: null, decidedAt: null
  };
  const newRef = requestsRef.push();
  requests[newRef.key] = newReq;
  renderList();
  newRef.set(newReq).catch(err => {
    delete requests[newRef.key];
    renderList();
    alert("Could not save the request: " + err.message);
  });
  startDateEl.value = ""; endDateEl.value = "";
  noteEl.value = ""; typeEl.selectedIndex = 0;
  daysHint.textContent = "";
});

// ---- Firebase sync ----
employeesRef.on("value", snap => {
  employees = snap.val() || DEFAULT_EMPLOYEES;
  buildUserSelect();
  toggleView();
});
requestsRef.on("value", snap => {
  requests = snap.val() || {};
  statusLine.textContent = "Synced";
  renderList();
}, err => {
  statusLine.textContent = "Connection error: " + err.message;
});

toggleView();
</script>
</body>
</html>
